<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频播放器</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="title" id="title">视频播放器</div>
      <div class="top-actions">
        <button class="ghost" id="btn-playlist">播放列表</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <video id="video" playsinline webkit-playsinline preload="metadata" referrerpolicy="no-referrer"></video>

      <button class="center-btn play" id="center-btn" aria-label="播放/暂停"></button>

      <div class="notice" id="notice" hidden></div>

      <div class="controls" id="controls">
        <div class="progress" id="progress">
          <div class="buffered" id="buffered"></div>
          <div class="played" id="played"></div>
          <div class="knob" id="knob"></div>
        </div>

        <div class="bar">
          <button class="icon play" id="btn-play" title="播放 / 暂停（空格）"></button>
          <span class="time"><span id="cur">00:00</span><i>/</i><span id="dur">00:00</span></span>

          <span class="spacer"></span>

          <button class="ghost small" id="btn-mute" title="静音（M）">静音</button>
          <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="1" title="音量">
          <div class="speed-box" title="倍速播放（无级调节）">
            <span class="speed-val" id="speed-val">1.00×</span>
            <input class="speed" id="speed" type="range" min="0.1" max="16" step="0.01" value="1" list="speed-presets">
            <datalist id="speed-presets">
              <option value="0.5"></option>
              <option value="1"></option>
              <option value="1.25"></option>
              <option value="1.5"></option>
              <option value="1.75"></option>
              <option value="2"></option>
              <option value="3"></option>
              <option value="5"></option>
            </datalist>
          </div>
          <button class="ghost small" id="btn-pip" title="画中画">画中画</button>
          <button class="ghost small" id="btn-full" title="全屏（F）">全屏</button>
        </div>
      </div>
    </main>

    <aside class="playlist" id="playlist" hidden>
      <div class="pl-head">
        <span>播放列表</span>
        <span class="pl-count" id="pl-count">0</span>
      </div>
      <ul class="pl-list" id="pl-list"></ul>
    </aside>
  </div>

  <script src="player.js"></script>
</body>
</html>
