<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>视频嗅探播放器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">视频嗅探播放器</div>
    <div class="actions">
      <button class="ghost" id="refresh">刷新</button>
      <button class="solid" id="playAll">播放全部</button>
    </div>
  </header>

  <div class="status" id="status">正在扫描当前页面…</div>

  <ul class="list" id="list"></ul>

  <footer>
    <span id="count">0 个资源</span>
    <span class="tip">HLS / DASH 需站点本身支持</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
